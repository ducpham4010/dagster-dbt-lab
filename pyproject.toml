[project]
name = "dagster_dbt_demo"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.24",
    "dagster-dbt>=0.29.24",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "dbt-postgres>=1.9.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_dbt_demo"
registry_modules = [
    "dagster_dbt_demo.components.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: cần kết nối Postgres thật (tự skip nếu không kết nối được). Bỏ qua: pytest -m 'not integration'",
]
filterwarnings = [
    # Cảnh báo beta/preview của Dagster, không liên quan tới test.
    "ignore::dagster.BetaWarning",
    "ignore::dagster.PreviewWarning",
    # Dagster còn gọi API cũ của pydantic khi đọc YAML component.
    "ignore:`parse_obj_as` is deprecated:DeprecationWarning",
    # Phát ra từ bên trong build_schedule_from_partitioned_job của Dagster (cách B), không phải code của mình.
    "ignore:Function `JobDefinition.run_request_for_partition` is deprecated:DeprecationWarning",
]
