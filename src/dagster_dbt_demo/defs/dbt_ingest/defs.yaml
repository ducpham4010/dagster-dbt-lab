# DbtProjectComponent + gộp thêm biến dbt tính bằng Python (vars_fn) và biến riêng từng run (tag dbt/vars).
# Cách truyền biến xuống dbt: docs/dbt_vars_guide.md
type: dagster_dbt_demo.components.DbtProjectWithVarsComponent
template_vars_module: .template_vars

attributes:
  project:
    project_dir: "{{ context.project_root }}/dbt"
    # profiles_dir: "{{ env.HOME }}/.dbt"
    profiles_dir: "{{ context.project_root }}/dbt"
    prepare_project_cli_args: ['compile', '--quiet']
  translation:
    group_name: "{{ 'raw/seeds' if node.name == 'raw_payments' else group_from_fqn(node.fqn) }}"
    description: |
      Model: {{ node.name }}

      SQL sau compile:
      {{ node.compiled_code | default('Chưa có compiled SQL', true) }}
  # select: "customers"
  cli_args:
    - build
    - --vars:
        start_date: "{{ partition_time_window.start.strftime('%Y-%m-%d') }}"
        end_date: "{{ partition_time_window.end.strftime('%Y-%m-%d') }}"
        partition_date: "{{ partition_key }}"
        # ---- Ví dụ (model chưa dùng), xem docs/dbt_vars_guide.md ----
        # Mục 1: suy ra từ partition. Lúc chạy chỉ có: partition_key, partition_time_window,
        # partition_key_range, env, datetime (datetime.datetime, datetime.timedelta).
        partition_month: "{{ partition_time_window.start.strftime('%Y-%m') }}"
        prev_date: "{{ (partition_time_window.start - datetime.timedelta(days=1)).strftime('%Y-%m-%d') }}"
        # Mục 2: hằng số và biến môi trường (.env).
        source_system: superapp
        target_schema: "{{ env('ORACLE_SCHEMA', 'DEV') }}"
  # Mục 4: hàm Python tính thêm biến lúc chạy (ghi đè biến cùng tên ở trên).
  vars_fn: dagster_dbt_demo.defs.dbt_ingest.dbt_vars.compute_dbt_vars

post_processing:
  assets:
    - target: "*"
      attributes:
        partitions_def: "{{ daily_partitions_def }}"

requirements:
  env:
    - HOME
