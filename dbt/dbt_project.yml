name: 'jaffle_shop'

config-version: 2
version: '0.1'

profile: 'jaffle_shop'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
    - "target"
    - "dbt_modules"
    - "logs"

require-dbt-version: [">=1.0.0", "<2.0.0"]

# Defaults so `dbt compile`/`parse` works without --vars (e.g. Dagster's prepare step).
# Partitioned runs from Dagster override these via `--vars` in defs.yaml.
vars:
  start_date: "1900-01-01"
  end_date: "1900-01-02"
  partition_date: "1900-01-01"

models:
  jaffle_shop:
      materialized: table
      # Doris defaults to 3 replicas -> CTAS fails on a single-BE lab cluster.
      +properties:
        replication_num: "{{ env_var('DORIS_REPLICATION_NUM', '1') }}"
      staging:
        materialized: view

seeds:
  jaffle_shop:
    +properties:
      replication_num: "{{ env_var('DORIS_REPLICATION_NUM', '1') }}"
    raw_customers_bk:
      enabled: false
    raw_orders_bk:
      enabled: false
