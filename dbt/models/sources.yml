version: 2
sources:
  - name: raw
    # Doris: schema = database. Python assets write into the same database as the dbt target.
    schema: "{{ target.schema }}"
    tables:
      - name: raw_customers
        meta:
          dagster:
            asset_key: ["raw_customers"]
      - name: raw_orders
        meta:
          dagster:
            asset_key: ["raw_orders"]
