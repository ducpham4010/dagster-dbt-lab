jaffle_shop:
  target: oracle
  outputs:
    dev:
      type: duckdb
      path: ~/tutorial.duckdb
      threads: 24

    postgres:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'dbt') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'dbt') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'jaffle_shop') }}"
      schema: analytics
      threads: 4

    oracle:
      type: oracle
      user: "{{ env_var('ORACLE_USER') }}"
      pass: "{{ env_var('ORACLE_PASSWORD') }}"
      # Easy Connect string, same as the Python assets use: host:port/service_name
      connection_string: "{{ env_var('ORACLE_DNS') }}"
      schema: "{{ env_var('ORACLE_SCHEMA', env_var('ORACLE_USER')) }}"
      threads: 4
