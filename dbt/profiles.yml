jaffle_shop:
  target: doris
  outputs:
    dev:
      type: duckdb
      path: ~/tutorial.duckdb
      threads: 24

    postgres:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'dbt') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'dbt') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'jaffle_shop') }}"
      schema: analytics
      threads: 4

    doris:
      type: doris
      host: "{{ env_var('DORIS_HOST', 'localhost') }}"
      # FE query port (MySQL protocol), not the 8030 HTTP port
      port: "{{ env_var('DORIS_PORT', '9030') | as_number }}"
      username: "{{ env_var('DORIS_USER', 'root') }}"
      password: "{{ env_var('DORIS_PASSWORD', '') }}"
      # Doris has no schema level: schema = database. `database` must be omitted or equal schema.
      schema: "{{ env_var('DORIS_SCHEMA', 'jaffle_shop') }}"
      threads: 4
